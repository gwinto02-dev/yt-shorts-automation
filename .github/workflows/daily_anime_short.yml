name: Daily Anime Recommendation Shorts

on:
  schedule:
    - cron: '0 0 * * *'  # Runs daily at midnight UTC
  workflow_dispatch:     # Allows manual trigger via GitHub Actions UI

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'


      - name: Install System FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pipeline Automated Tests
        run: |
          python -m unittest discover -s tests -p "test_*.py"

      - name: Execute Daily Anime Short Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY_STATUS: "private"
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
        run: |
          python main.py --all

      - name: Commit and Push Updated History Files
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No history changes to commit."
          else
            git commit -m "Update history data [skip ci]"
            # Stash anything else left over from this run (e.g. pipeline
            # output/log files outside data/) so the rebase below has a
            # fully clean working tree to operate on. This runner is
            # disposed of after the job finishes, so there's no need to
            # restore the stash afterward.
            git stash --include-untracked || true
            git pull --rebase origin main
            git push
          fi

      - name: Upload Video Artifact on Failure or Completion
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-anime-short-output
          path: |
            output/
            assets/images/
          retention-days: 7
