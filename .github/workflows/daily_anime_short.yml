name: Daily Anime Recommendation Shorts

on:
  schedule:
    - cron: '0 0 * * *'  # Runs daily at midnight UTC
  workflow_dispatch:     # Allows manual trigger via GitHub Actions UI

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'


      - name: Install System FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pipeline Automated Tests
        run: |
          python -m unittest discover -s tests -p "test_*.py"

      - name: Execute Daily Anime Short Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY_STATUS: "private"
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
        run: |
          python main.py --all

      - name: Commit and Push Updated History Files
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No history changes to commit."
          else
            git commit -m "Update history data [skip ci]"

            # Instead of a git-level rebase/merge (which fails with text
            # conflicts on these JSON array files whenever two runs append
            # different entries), fetch the remote's current version of
            # each history file and merge them at the JSON content level
            # using merge_history_json.py — this treats each file as an
            # append-only log and unions entries, avoiding conflicts
            # entirely for this file shape.
            git fetch origin main
            for f in data/*.json; do
              if git cat-file -e origin/main:"$f" 2>/dev/null; then
                git show origin/main:"$f" > /tmp/remote_$(basename "$f") 2>/dev/null || echo "[]" > /tmp/remote_$(basename "$f")
                python scripts/merge_history_json.py "$f" /tmp/remote_$(basename "$f") "$f"
              fi
            done

            git add data/
            if git diff --cached --quiet; then
              echo "Merge resulted in no net changes."
            else
              git commit -m "Merge history data with remote [skip ci]" --amend --no-edit || git commit -m "Merge history data with remote [skip ci]"
            fi

            # Safety net: sweep up any other modified/untracked files left
            # over from this run (e.g. output/ artifacts, if the .gitignore
            # ever misses one) so the rebase below always has a genuinely
            # clean working tree to operate on. This runner is disposed of
            # after the job finishes, so there's no need to restore the
            # stash afterward.
            git stash --include-untracked || true

            # Rebase onto whatever else may have landed since the fetch
            # above (rare, but possible) — the working tree is clean now
            # since the JSON merge already resolved the only files that
            # were diverging, so this should apply cleanly.
            if ! git pull --rebase origin main; then
              echo "Rebase failed — forcing history files to the merged local state."
              # Only call --abort if a rebase actually started; calling it
              # otherwise fails with "no rebase in progress" and crashes
              # this step even though there's nothing left to clean up.
              if [ -d .git/rebase-merge ] || [ -d .git/rebase-apply ]; then
                git rebase --abort
              fi
              git push --force-with-lease
            else
              git push
            fi
          fi

      - name: Upload Video Artifact on Failure or Completion
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-anime-short-output
          path: |
            output/
            assets/images/
          retention-days: 7
